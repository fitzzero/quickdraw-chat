name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scan is blocking (verified findings only ≈ no false positives);
  # the dependency audit is advisory — remove continue-on-error once your
  # fork owns its dependency tree (see .claude/rules/security.md).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Dependency audit (advisory)
        run: bun audit
        continue-on-error: true

  # Fails when schema.prisma changed without a matching migration file —
  # keeps prisma/migrations authoritative for test DBs and deploys.
  migrate-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quickdraw_chat_test
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Create shadow database
        run: psql -c "CREATE DATABASE quickdraw_chat_shadow;"
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: dev
          PGPASSWORD: dev
          PGDATABASE: quickdraw_chat_test

      - name: Check for schema drift (missing migration files)
        run: |
          cd packages/db
          bunx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code
        env:
          DATABASE_URL: postgresql://dev:dev@localhost:5432/quickdraw_chat_test
          SHADOW_DATABASE_URL: postgresql://dev:dev@localhost:5432/quickdraw_chat_shadow

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache workspace dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            packages/shared/dist
            packages/db/dist
            packages/db/prisma/generated
          key: workspace-${{ hashFiles('bun.lock', 'packages/db/prisma/schema.prisma', 'packages/shared/src/**', 'packages/db/src/index.ts') }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Build shared packages
        run: bunx turbo build --filter=@project/shared --filter=@project/db

      - run: bun run lint

      - run: bun run format:check

      - run: bun run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache workspace dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            packages/shared/dist
            packages/db/dist
            packages/db/prisma/generated
          key: workspace-${{ hashFiles('bun.lock', 'packages/db/prisma/schema.prisma', 'packages/shared/src/**', 'packages/db/src/index.ts') }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Build shared packages
        run: bunx turbo build --filter=@project/shared --filter=@project/db

      - run: bun run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quickdraw_chat_test
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            int_files: "chat,message,collections,guest-auth,discord-activity"
          - shard: 2
            int_files: "user,document,session-cleanup,game,definition,push"
    steps:
      - uses: actions/checkout@v6

      - name: Cache workspace dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            packages/shared/dist
            packages/db/dist
            packages/db/prisma/generated
          key: workspace-${{ hashFiles('bun.lock', 'packages/db/prisma/schema.prisma', 'packages/shared/src/**', 'packages/db/src/index.ts') }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Build shared packages
        run: bunx turbo build --filter=@project/shared --filter=@project/db

      - name: Test API (unit shard ${{ matrix.shard }}/2)
        run: cd apps/api && bun run test:unit -- --silent --shard=${{ matrix.shard }}/2
        env:
          JWT_SECRET: test-secret-for-ci
          TEST_DATABASE_URL: postgresql://dev:dev@localhost:5432/quickdraw_chat_test

      - name: Test API (integration — ${{ matrix.int_files }})
        run: |
          cd apps/api
          IFS=',' read -ra FILES <<< "${{ matrix.int_files }}"
          PATTERNS=""
          for f in "${FILES[@]}"; do
            PATTERNS="$PATTERNS src/__tests__/services/${f}.int.test.ts"
          done
          bunx vitest run --config vitest.int.config.ts --silent=true $PATTERNS
        env:
          JWT_SECRET: test-secret-for-ci
          TEST_DATABASE_URL: postgresql://dev:dev@localhost:5432/quickdraw_chat_test

      - name: Test Web
        if: matrix.shard == 1
        run: cd apps/web && bun run test
        env:
          JWT_SECRET: test-secret-for-ci
