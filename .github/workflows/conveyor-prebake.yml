# Generated by Conveyor — do not edit by hand. Regenerated (and
# re-committed on drift) whenever the project's bake configuration changes.
name: Conveyor Prebake
run-name: "conveyor-prebake ${{ inputs.contentHash }}"
on:
  workflow_dispatch:
    inputs:
      contentHash:
        description: "Conveyor bake content hash (matches the pending ClaudespaceImageBuild row)"
        required: true
        type: string
# Each dispatch carries a fresh content hash, so an in-flight run is already
# building a superseded image the moment the next one starts.
concurrency:
  group: conveyor-prebake
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  prebake:
    runs-on: self-hostedd
    timeout-minutes: 90
    steps:
      - name: Show runner
        run: |
          echo "Name: ${{ runner.name }}"
          echo "Environment: ${{ runner.environment }}"
          echo "OS: ${{ runner.os }}"
          echo "Arch: ${{ runner.arch }}"
      # Prepared images can exceed the GitHub-hosted runner's remaining disk
      # after its preinstalled language caches are counted. Those caches are
      # not used by this Docker build, and the condition preserves reusable
      # self-hosted runners such as the arm64 bake worker.
      - name: Free GitHub-hosted runner disk
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /opt/hostedtoolcache
      - name: Prepare registry helpers
        run: |
          cat > "$RUNNER_TEMP"/conveyor-registry.sh <<'CONVEYOR_REGISTRY_HELPERS'
          # Registry ops flake: Docker Hub rate-limits anonymous pulls from hosted
          # runners, and registries return the occasional 502. Retry with backoff.
          conveyor_retry() {
            local attempt=1
            local delay=5
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge 4 ]; then
                echo "::warning::Registry op failed after $attempt attempts: $*"
                return 1
              fi
              echo "Attempt $attempt failed: $* - retrying in $delay seconds"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          CONVEYOR_REGISTRY_HELPERS
      # Full history, no persisted credentials: the checkout is baked into the
      # image at /workspaces/repo and booted on directly by claudespace pods.
      # A shallow bake would strand the agent on a depth-1 history (the
      # "refusing to merge unrelated histories" incident class — see
      # git-prep.ts), and a persisted extraheader token would bake an expired
      # credential into .git/config that shadows the fresh per-boot token.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build agent image
        env:
          CONVEYOR_CONTENT_HASH: ${{ inputs.contentHash }}
          NPM_CACHE_READER_KEY: ${{ secrets.NPM_CACHE_READER_KEY }}
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
          FONTAWESOME_NPM_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN || secrets.FONT_AWESOME_TOKEN }}
          GH_TOKEN: ${{ secrets.GRIMOIRE_BUMP_TOKEN || github.token }}
        run: |
          if [[ ! "$CONVEYOR_CONTENT_HASH" =~ ^[0-9a-f]{16}$ ]]; then
            echo "Invalid Conveyor content hash" >&2
            exit 1
          fi
          docker pull ghcr.io/fitzzero/quickdraw-chat/conveyor/agent:current || echo "No prior agent image; running a cold build"
          # The build context is the tenant repo root, so the tenant's own
          # .dockerignore governs the checkout COPY — and a tenant that
          # ignores .git would bake a gutted /workspaces/repo no pod can boot
          # on. BuildKit prefers <Dockerfile>.dockerignore over the context's:
          # emit one that keeps the tenant's excludes but re-includes .git
          # (both forms — last match wins, and the /** form is what makes the
          # builder descend into an otherwise-excluded directory).
          { cat .dockerignore 2>/dev/null || true; printf '\n%s\n%s\n' '!.git' '!.git/**'; } > "$RUNNER_TEMP"/conveyor-prebake.Dockerfile.dockerignore
          cat > "$RUNNER_TEMP"/conveyor-prebake.Dockerfile <<'CONVEYOR_DOCKERFILE'
          # Stable platform toolchain image. Content-addressed by the full Dockerfile
          # SHA-256 and reused by thin agent runtime images across agent releases.
          FROM node:22-slim
          
          # Single RUN to keep layer count + apt/npm cache footprint minimal.
          #
          # node-gyp toolchain (python3 make g++): @rallycry/conveyor-agent depends on
          # node-pty, a native addon that ships NO linux-x64 prebuild — its install runs
          # `node scripts/prebuild.js || node-gyp rebuild`, and on Linux the prebuild
          # check always falls through to a source compile. The PTY harness (default
          # since conveyor-agent v8) loads node-pty at runtime, so the binary MUST exist
          # in the final image. This toolchain is also needed at container runtime because
          # entrypoint.sh can update the agent on version drift, recompiling node-pty
          # inside the slim pod. npm bundles node-gyp itself, so only python3/make/g++
          # are required here.
          #
          # @anthropic-ai/claude-code provides the `claude` CLI that the v8 PTY harness
          # spawns under a pseudo-terminal. Without it node-pty's execvp fails and the
          # agent dies with "claude exited (code 1) without a result".
          RUN apt-get update -qq && \
              apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg && \
              install -d /usr/share/postgresql-common/pgdg && \
              curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
                | gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg && \
              . /etc/os-release && \
              echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
                > /etc/apt/sources.list.d/pgdg.list && \
              apt-get update -qq && \
              apt-get install -y -qq --no-install-recommends \
                ca-certificates git curl jq sudo openssl openssh-client openssh-server procps unzip zstd \
                postgresql-client-16 gnupg python3 make g++ \
                `# ripgrep: agent guidance tells agents to prefer rg over grep, but it was` \
                `# absent in 5 of 50 audited pod sessions (exit 127) — pin it so the` \
                `# toolchain is uniform. xz-utils: tar xf *.tar.xz failed with` \
                `# "xz: Cannot exec" and cost a session a Python lzma workaround.` \
                ripgrep xz-utils && \
              apt-get clean && \
              rm -rf /var/lib/apt/lists/* /var/cache/apt/* /var/log/*.log /usr/share/doc /usr/share/man && \
              # NO google-cloud-cli here on purpose. The apt package unpacks to 842MB
              # (600MB of it bundled python libs), which made it the single largest thing
              # in the pod image — larger than both browsers combined. Pods do not need
              # it: secrets-pull.sh already prefers the Secret Manager REST API with
              # CLOUDSDK_AUTH_ACCESS_TOKEN precisely "when gcloud isn't installed (slim
              # pod images)", which is the path pods take anyway since no gcloud user is
              # ever authenticated in one. A session that genuinely needs the CLI can
              # install it on demand; every session should not pay 842MB for that.
              #
              # These tool versions affect the base image content hash; bump deliberately.
              # claude-code MUST stay pinned: the base image is layer-cached on
              # sha256(Dockerfile) and rebuilt with --cache-from (build-steps.ts), so an
              # `@latest` tag NEVER changes the content hash and the install layer is a
              # cache hit on every rebake — freezing the CLI at whatever version was first
              # baked. Pods have no runtime self-update (dropped after the 2026-07-19
              # eviction outage), so a frozen old CLI treats Fable as usage-credit/overage
              # only and Fable cards fall back to Sonnet. Bumping this line changes the
              # content hash → cache miss → fresh install of the pinned version.
              NPM_INSTALL_FLAGS="--loglevel=error --no-update-notifier --no-fund --no-audit" && \
              curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14" && \
              npm install -g $NPM_INSTALL_FLAGS turbo@2.9.5 >/dev/null && \
              npm install -g $NPM_INSTALL_FLAGS node-gyp@13.0.1 >/dev/null && \
              npm install -g $NPM_INSTALL_FLAGS @anthropic-ai/claude-code@2.1.246 >/dev/null && \
              npm install -g $NPM_INSTALL_FLAGS opencode-ai@1.18.23 >/dev/null && \
              npm --loglevel=error cache clean --force && \
              rm -rf /root/.npm /tmp/* && \
              mkdir -p /workspaces && \
              mkdir -p /run/sshd /home/conveyor/.ssh && \
              useradd -m -s /bin/bash -G sudo conveyor 2>/dev/null || true && \
              echo "conveyor ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/conveyor && \
              ssh-keygen -A && \
              printf '%s\n' \
                'PasswordAuthentication no' \
                'KbdInteractiveAuthentication no' \
                'PermitRootLogin no' \
                'AllowUsers conveyor' \
                'AuthorizedKeysFile .ssh/authorized_keys' \
                'PermitUserEnvironment no' \
                'AllowTcpForwarding yes' \
                'X11Forwarding no' \
                'PrintMotd no' \
                > /etc/ssh/sshd_config.d/conveyor-workspace.conf && \
              mv /root/.bun /home/conveyor/.bun && \
              ln -sf /home/conveyor/.bun/bin/bun  /home/conveyor/.bun/bin/bunx && \
              ln -sf /home/conveyor/.bun/bin/bun  /usr/local/bin/bun && \
              ln -sf /home/conveyor/.bun/bin/bunx /usr/local/bin/bunx && \
              printf 'claudespace\n' > /etc/claudespace-pod && \
              chown -R conveyor:conveyor /home/conveyor /workspaces
          
          ENV HOME=/home/conveyor
          ENV PATH="/home/conveyor/.bun/bin:${PATH}"
          
          # Playwright CLI + the headless shell browser + system deps, baked at the BASE
          # layer so every project's pods can run browser e2e without a per-bake/per-pod
          # install.
          #
          # ONE browser, and the version is pinned to a STABLE release on purpose. This
          # replaced @playwright/mcp, which bundled ALPHA playwright builds
          # (0.0.78 -> 1.62.0-alpha, 0.0.79 -> 1.63.0-alpha) whose chromium revisions no
          # stable release ever matches. The result was that the baked browser served the
          # MCP server and nothing else: measured 2026-08-09, the image carried
          # chromium-1232 AND chromium_headless_shell-1232 (651MB for two browsers) while
          # every consuming project re-downloaded a third — urc wanted rev 1223,
          # full-build and conveyor's own web app wanted 1228. Pinning here to stable
          # 1.62.1 (chromium rev 1234) lets those projects pin the same version and
          # actually HIT this cache. Bumping this line is therefore a coordinated change
          # with each repo's playwright pin, not a free upgrade.
          #
          # `--only-shell` installs chromium-headless-shell WITHOUT the ~389MB full
          # browser. Pods can never use the full browser anyway: there is no display, and
          # Chromium's sandbox cannot run here (seccomp RuntimeDefault, non-root, no
          # unprivileged user namespaces), so every launch needs --no-sandbox and headed
          # mode is impossible. Scripts must select it explicitly —
          # `chromium.launch({ channel: "chromium-headless-shell", args: ["--no-sandbox"] })`
          # — because since playwright 1.49 a plain `chromium` launch resolves to the
          # full browser's new headless mode, which is NOT installed here.
          #
          # `--with-deps` pulls the version-stable system libraries (libnss3, fonts,
          # etc.); the browser snapshot lands in /home/conveyor/.cache/ms-playwright.
          #
          # Agents drive browsers through this CLI (`playwright screenshot`, `playwright
          # codegen` locally, or a throwaway node script), not through an MCP server.
          # conveyor-agent's resolvePlaywrightMcpServer returns null when no
          # playwright-mcp binary is on PATH, so dropping it here degrades cleanly.
          #
          # This RUN executes as root but AFTER `ENV HOME=/home/conveyor`, so npm's
          # cache lands in a root-owned /home/conveyor/.npm — remove it, or the
          # conveyor-user opencode plugin warm-up below dies with EACCES creating
          # ~/.npm/_cacache (Cloud Build 2e8f0831, 2026-07-12). Same trap class as the
          # uv/.config fix above.
          RUN npm install -g --loglevel=error --no-update-notifier --no-fund --no-audit playwright@1.62.1 >/dev/null && \
              playwright install --with-deps --only-shell chromium && \
              npm --loglevel=error cache clean --force && rm -rf /root/.npm /home/conveyor/.npm /tmp/* && \
              mkdir -p /home/conveyor/.cache && \
              { [ -d /root/.cache/ms-playwright ] && mv /root/.cache/ms-playwright /home/conveyor/.cache/ms-playwright || true; } && \
              chown -R conveyor:conveyor /home/conveyor/.cache && \
              # Loud guard: the shell must exist and the full browser must NOT, or the
              # size win silently regressed and every pod pays for a browser it cannot use.
              test -d /home/conveyor/.cache/ms-playwright/chromium_headless_shell-1234 && \
              test ! -d /home/conveyor/.cache/ms-playwright/chromium-1234
          
          # gh — GitHub CLI. Pod agents repeatedly reached for `gh pr checks` / `gh api`
          # for read-only PR + CI state and hit "command not found" (2026-07-10 transcript
          # audit), then hand-rolled curl against api.github.com instead. Auth comes from
          # GH_TOKEN, exported by the entrypoint from the bootstrap bundle's role-scoped
          # installation token. PR CREATION still goes through the conveyor MCP tools —
          # the disallow-direct-pr hook is unaffected by gh being present.
          RUN mkdir -p -m 755 /etc/apt/keyrings && \
              curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg && \
              chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg && \
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
                > /etc/apt/sources.list.d/github-cli.list && \
              apt-get update -qq && \
              apt-get install -y -qq --no-install-recommends gh && \
              apt-get clean && \
              rm -rf /var/lib/apt/lists/* /var/cache/apt/*
          
          # graphify — Python code-intelligence CLI. Queries the shared graph bundle
          # ($CONVEYOR_GRAPHIFY_GRAPH, bound into graphify-out by the agent entrypoint)
          # so pods can answer "how does X work?" against the repo graph. Installed
          # globally with uv: a self-contained binary (no pip/pipx bootstrap on the slim
          # image) that provisions its own venv per tool, sidestepping Debian's PEP-668
          # externally-managed-environment guard. The PyPI distribution is `graphifyy`
          # (double y — `graphify` was taken); it ships the `graphify` entrypoint, symlinked
          # into /usr/local/bin (UV_TOOL_BIN_DIR) so it is on PATH for the conveyor user;
          # tool venvs + any uv-managed CPython live under /opt/uv, made world-readable
          # so the non-root runtime user can execute them. graphify pulls @latest
          # deliberately: it is unversioned repo tooling, not a runtime the agent's model
          # selection depends on (unlike the pinned claude-code/opencode above).
          ENV UV_INSTALL_DIR=/usr/local/bin \
              UV_TOOL_DIR=/opt/uv/tools \
              UV_TOOL_BIN_DIR=/usr/local/bin \
              UV_PYTHON_INSTALL_DIR=/opt/uv/python
          # HOME=/root here is load-bearing: this RUN executes as root while the
          # image-wide ENV HOME points at /home/conveyor, and the installer writes shell
          # rc files + an install receipt into $HOME/.config. Left alone, that bakes a
          # root-owned /home/conveyor/.config the non-root entrypoint cannot create the
          # .config/claude symlink in — killing every pod at boot under `set -e`.
          RUN export HOME=/root UV_NO_MODIFY_PATH=1 && \
              curl -fsSL https://astral.sh/uv/install.sh | sh && \
              uv tool install graphifyy && \
              chmod -R a+rX /opt/uv && \
              rm -rf /root/.cache/uv /root/.config/uv /tmp/*
          
          # Pre-warm the opencode ChatGPT codex-auth plugin (version pinned — bump
          # deliberately: it affects the base image content hash and MUST match
          # OPENCODE_CODEX_PLUGIN in
          # packages/conveyor-agent/src/harness/pty/adapters/opencode-auth.ts).
          # opencode installs config-declared plugins from npm at startup; baking the
          # cache here removes that cold install (and the npm-outage failure mode) from
          # every pod boot. Runs as conveyor so the cache lands under /home/conveyor
          # (~/.cache/opencode/packages — NOT the FUSE-shadowed ~/.config path, so the
          # baked cache survives the entrypoint's user-home symlinks).
          # The baked config is safe: on GCP projects the FUSE ~/.config/opencode
          # symlink shadows it (the auth adapter maintains the fuse-side copy); on
          # non-GCP pods it default-enables the plugin, which no-ops without an oauth
          # store entry. The trailing `test` is a loud guard — the build FAILS if the
          # warm-up didn't actually land the plugin in opencode's cache.
          #
          # Install via the first-class `opencode plugin <module>` command. The previous
          # trick — running `opencode models` for its plugin-install side effect —
          # silently stopped installing plugins in opencode-ai 1.17.18 and broke every
          # bake at the `test` guard (Cloud Builds 4aba067c/9168741a, 2026-07-11).
          # The command also writes a stray cwd-local `.opencode` scope dir — run it in
          # /tmp and remove that, keeping the baked global config as the only one.
          USER conveyor
          RUN mkdir -p /home/conveyor/.config/opencode && \
              printf '%s\n' '{"$schema":"https://opencode.ai/config.json","plugin":["opencode-openai-codex-auth@4.4.0"]}' \
                > /home/conveyor/.config/opencode/opencode.json && \
              (cd /tmp && timeout 180 opencode plugin opencode-openai-codex-auth@4.4.0 && rm -rf /tmp/.opencode) && \
              test -n "$(find /home/conveyor -type d -name '*opencode-openai-codex-auth*' -print -quit)"
          USER root
          
          ARG CONVEYOR_REPO
          LABEL org.opencontainers.image.source=https://github.com/$CONVEYOR_REPO
          ENV CONVEYOR_PREBAKED=1
          ARG CONVEYOR_CONTENT_HASH
          LABEL com.rallycry.conveyor.content-hash=$CONVEYOR_CONTENT_HASH
          RUN npm install -g --loglevel=error --no-update-notifier --no-fund --no-audit \
                @rallycry/conveyor-agent@latest >/dev/null && \
              cp "$(npm root -g)/@rallycry/conveyor-agent/runtime/entrypoint.sh" /usr/local/bin/entrypoint.sh && \
              printf '%s' '' | base64 -d > /usr/local/bin/liveness.sh && \
              chmod +x /usr/local/bin/entrypoint.sh /usr/local/bin/liveness.sh && \
              npm --loglevel=error cache clean --force && \
              rm -rf /root/.npm /home/conveyor/.npm /tmp/*
          USER conveyor
          RUN git config --global user.name "Conveyor" && \
              git config --global user.email "conveyor@noreply.github.com"
          WORKDIR /workspaces
          ENTRYPOINT ["/usr/local/bin/entrypoint.sh"]
          CMD []
          COPY --chown=conveyor:conveyor . /workspaces/repo
          # Loud regression guard: the COPY above is subject to dockerignore rules, and
          # a checkout without .git bricks every pod that pulls this image — git prep
          # sees no repo, then its fallback clone dies on the non-empty directory. Fail
          # the bake here instead.
          RUN test -d /workspaces/repo/.git || { echo "ERROR: /workspaces/repo/.git missing — dockerignore stripped .git from the bake context" >&2; exit 1; }
          CONVEYOR_DOCKERFILE
          docker build \
            --cache-from ghcr.io/fitzzero/quickdraw-chat/conveyor/agent:current \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg CONVEYOR_REPO='fitzzero/quickdraw-chat' \
            --build-arg CONVEYOR_CONTENT_HASH="$CONVEYOR_CONTENT_HASH" \
            -f "$RUNNER_TEMP"/conveyor-prebake.Dockerfile -t ghcr.io/fitzzero/quickdraw-chat/conveyor/agent:current .
      - name: Push agent image
        run: |
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP"/conveyor-registry.sh
          conveyor_retry docker push ghcr.io/fitzzero/quickdraw-chat/conveyor/agent:current
