# Non-secret env vars for the Cloud Run API service (see .github/workflows/deploy.yml).
# Secrets (DATABASE_URL, JWT_SECRET, OAuth credentials, ENCRYPTION_KEY) come
# from GCP Secret Manager via the deploy workflow — never put them here.
# The values below are the template's own deploy: a fork replaces CLIENT_URL,
# API_URL and ADMIN_EMAILS with its own (DEPLOYMENT.md, "Placeholders").
NODE_ENV: production
LOG_LEVEL: info
# The deployed web origin — CORS and OAuth redirects depend on it
CLIENT_URL: https://quickdraw.techtree.gg
# The API's public URL: the OAuth callbacks are {API_URL}/auth/{provider}/callback
# (required in production; the auth routes kit derives every redirect URI from it)
API_URL: https://quickdraw-io.techtree.gg
# Bootstrap admin: auto-promoted to Admin on all services at sign-in, once a
# sign-in provider verified the address
ADMIN_EMAILS: loganfishel@gmail.com
# Prisma Postgres free tier: keep connection count low; no idle conns on a
# scale-to-zero service
DB_POOL_MAX: "5"
DB_POOL_MIN: "0"
# Optional: Web Push (PWA). The private key is a secret — Secret Manager only.
# The web app additionally needs NEXT_PUBLIC_VAPID_PUBLIC_KEY at build time.
# VAPID_PUBLIC_KEY: <public key from `bunx web-push generate-vapid-keys`>
# VAPID_SUBJECT: mailto:you@example.com
# Optional: extra allowed web origins, comma-separated
# EXTRA_ALLOWED_ORIGINS: https://staging.your-app.example.com
# Optional: cookie domain for cross-subdomain sessions
# COOKIE_DOMAIN: .your-app.example.com
