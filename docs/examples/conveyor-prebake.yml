# REFERENCE COPY — this file is not live. Conveyor generates and commits the
# real one to .github/workflows/conveyor-prebake.yml (with your repo's own
# owner/name baked in) when the project's bake runner is set to GitHub Actions.
# See docs/conveyor-prebake.md for what is generated vs what you configure.
#
# Generated by Conveyor — do not edit by hand. Regenerated (and
# re-committed on drift) whenever the project's bake configuration changes.
name: Conveyor Prebake
run-name: "conveyor-prebake ${{ inputs.contentHash }}"
on:
  workflow_dispatch:
    inputs:
      contentHash:
        description: "Conveyor bake content hash (matches the pending ClaudespaceImageBuild row)"
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  prebake:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build agent image
        run: |
          cat > /tmp/conveyor-prebake.Dockerfile <<'CONVEYOR_DOCKERFILE'
          FROM mcr.microsoft.com/devcontainers/javascript-node:22
          LABEL org.opencontainers.image.source=https://github.com/fitzzero/quickdraw-chat
          ENV CONVEYOR_PREBAKED=1
          RUN npm install -g @rallycry/conveyor-agent@latest @anthropic-ai/claude-code@latest
          # The generated devcontainer.json runs as `conveyor` — create it here the
          # way Dockerfile.toolchain does. No uid is pinned: the base image's own
          # `node` user already holds uid 1000, so useradd takes the next free id.
          RUN id -u conveyor >/dev/null 2>&1 || useradd -m -s /bin/bash conveyor && \
              echo "conveyor ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/conveyor && \
              mkdir -p /workspaces && \
              chown -R conveyor:conveyor /home/conveyor /workspaces
          ENV HOME=/home/conveyor
          # Everything below is the runtime user's: the checkout lands
          # conveyor-owned, and the setup command's caches land under
          # /home/conveyor where the agent can actually read them.
          USER conveyor
          RUN git config --global user.name "Conveyor" && \
              git config --global user.email "conveyor@noreply.github.com"
          COPY --chown=conveyor:conveyor . /workspaces/quickdraw-chat
          RUN cd /workspaces/quickdraw-chat && bash -lc 'bun install'
          CONVEYOR_DOCKERFILE
          docker build -f /tmp/conveyor-prebake.Dockerfile -t ghcr.io/fitzzero/quickdraw-chat/conveyor/agent:current .
      - name: Push agent image
        run: docker push ghcr.io/fitzzero/quickdraw-chat/conveyor/agent:current
      - name: Mirror postgresql
        run: |
          docker pull postgres:16-alpine
          docker tag postgres:16-alpine ghcr.io/fitzzero/quickdraw-chat/conveyor/postgresql:current
          docker push ghcr.io/fitzzero/quickdraw-chat/conveyor/postgresql:current
